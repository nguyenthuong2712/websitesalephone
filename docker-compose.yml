services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    platform: linux/amd64
    container_name: ${DB_CONTAINER_NAME:-manager-sale-phone-db}
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
      DB_NAME: ${DB_NAME:-manager_sale_phone}
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./manager_sale_phone.bak:/var/opt/mssql/backup/manager_sale_phone.bak:ro
      - ./docker/init-db.sh:/usr/config/init-db.sh:ro
    command: >
      /bin/bash -c "/opt/mssql/bin/sqlservr & /bin/bash /usr/config/init-db.sh; wait"

volumes:
  sqlserver_data:
